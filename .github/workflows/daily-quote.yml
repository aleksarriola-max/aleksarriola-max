name: Daily Quote

on:
  schedule:
    # 11:00 UTC ≈ 6-7am US Eastern depending on DST
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update quote in README
        run: python3 scripts/update_quote.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No change for today's quote."
          else
            git commit -m "chore: update daily quote"
            git push
          fi
